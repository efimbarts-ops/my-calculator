<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Calc</title>
    <!-- Подключаем SDK Телеграма -->
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1f1f1f; color: white; text-align: center; padding: 20px; }
        #display { width: 100%; max-width: 260px; height: 50px; font-size: 24px; text-align: right; margin-bottom: 15px; background: #000; color: #0f0; border: none; padding: 5px 10px; border-radius: 8px; }
        button { width: 60px; height: 60px; font-size: 20px; margin: 5px; background: #333; color: white; border: none; border-radius: 10px; cursor: pointer; }
        button:active { background: #555; }
        .action { width: 100%; max-width: 280px; background: #007aff; height: 55px; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>Тест калькулятора</h2>
    <input type="text" id="display" readonly placeholder="0">

    <div>
        <button onclick="add('7')">7</button>
        <button onclick="add('8')">8</button>
        <button onclick="add('9')">9</button>
        <br>
        <button onclick="add('4')">4</button>
        <button onclick="add('5')">5</button>
        <button onclick="add('6')">6</button>
        <br>
        <button onclick="clearDisplay()" style="background: #ff3b30;">C</button>
        <button onclick="add('0')">0</button>
        <button onclick="alert('Работает!')" style="background: #34c759;">=</button>
    </div>

    <button class="action" onclick="sendTest()">⚡ Проверка ИИ кнопки</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let display = document.getElementById('display');

        function add(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = '';
        }

        function sendTest() {
            // Отправляем тестовый текст напрямую в чат
            tg.sendData("action_scan_photo");
            tg.close();
        }
    </script>
</body>
</html>
