<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Calc & AI</title>
    <!-- Подключаем SDK Телеграма -->
    <script src="https://telegram.org"></script>
    <!-- Подключаем мощную математическую библиотеку для подсчетов -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1f1f1f; color: white; text-align: center; padding: 20px; margin: 0; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 320px; margin: 20px auto; }
        button { padding: 20px; font-size: 18px; background: #333; color: white; border: none; border-radius: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        button:active { background: #444; }
        button.action { background: #007aff; font-weight: bold; }
        button.action:active { background: #0056b3; }
        #display { width: 100%; max-width: 290px; height: 60px; font-size: 26px; text-align: right; margin: 0 auto 15px auto; background: #000; color: #0f0; border: none; border-radius: 8px; padding: 5px 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>Инженерный ИИ-Калькулятор</h2>
    <input type="text" id="display" readonly placeholder="0">

    <div class="calc-grid">
        <!-- Кнопки тригонометрии -->
        <button onclick="add('sin(')">sin</button>
        <button onclick="add('cos(')">cos</button>
        <button onclick="add('tg(')">tg</button>
        <button onclick="clearDisplay()" style="background: #ff3b30;">C</button>
        
        <!-- Цифры и знаки -->
        <button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button><button onclick="add('/')">/</button>
        <button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button><button onclick="add('*')">*</button>
        <button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button><button onclick="add('-')">-</button>
        <button onclick="add('0')">0</button><button onclick="add('.')">.</button>
        <button onclick="calculate()" style="grid-column: span 2; background: #34c759;">=</button>
    </div>

    <hr style="border: 0.5px solid #444; margin: 30px 0;">

    <h3>Решить задачу по фото</h3>
    <button class="action" onclick="closeAndAskPhoto()" style="width: 90%; padding: 20px; font-size: 20px;">
        📸 Сфоткать / Из галереи
    </button>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Раскрываем на весь экран

        let display = document.getElementById('display');

        function add(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = '';
        }

        function calculate() {
            try {
                // Переводим наши "tg" в понятные для библиотеки "tan"
                let expression = display.value.replace(/tg\(/g, 'tan(');
                
                // Считаем выражение с помощью библиотеки math.js
                let result = math.evaluate(expression);
                
                // Округляем до 6 знаков, чтобы не было длинных хвостов
                display.value = math.format(result, {precision: 14});
            } catch (error) {
                display.value = 'Ошибка';
            }
        }

        // Исправленная функция для кнопки фото
        function closeAndAskPhoto() {
            // Отправляем специальную текстовую команду в чат бота
            tg.sendData("action_scan_photo");
            // Закрываем окно калькулятора
            tg.close();
        }
    </script>
</body>
</html>
